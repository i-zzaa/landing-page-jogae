<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Jogaê — voltando pro app</title>
<style>
  :root { --primary: #ff6a00; --bg: #fcfbfa; --text: #1f1f1f; --text-muted: #8c8c8c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px;
  }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid #ffe7d2; border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; color: var(--text-muted); font-size: 14px; max-width: 40ch; }
  a { color: var(--primary); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">Voltando pro app Jogaê…</p>
  <a id="fallback" href="#" style="display:none;">Toque aqui se o app não abrir sozinho</a>

  <script>
    // Ponte OAuth do Mercado Pago (só aceita redirect_uri https, não esquema
    // customizado) — pega o "code" que o MP devolveu e repassa pro app via
    // jogae://arena-mercado-pago?code=... . Mantém os outros parametros (ex.
    // state) tambem, caso existam.
    var params = new URLSearchParams(window.location.search);
    var target = 'jogae://arena-mercado-pago?' + params.toString();

    var fallback = document.getElementById('fallback');
    fallback.href = target;
    fallback.style.display = 'inline-block';

    if (params.get('code')) {
      window.location.replace(target);
    } else {
      document.getElementById('msg').textContent = 'Não recebemos o código de autorização. Volte ao app e tente conectar de novo.';
    }
  </script>
</body>
</html>
